<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    /* Add your CSS styles here */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .tab {
      overflow: hidden;
      border: 1px solid #ccc;
      background-color: #f1f1f1;
    }
    .tab button {
      background-color: inherit;
      float: left;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 16px;
      transition: 0.3s;
      font-size: 17px;
    }
    .tab button:hover {
      background-color: #ddd;
    }
    .tab button.active {
      background-color: #ccc;
    }
    .tabcontent {
      display: none;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-top: none;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .form-group button {
      padding: 10px 20px;
      background-color: #28a745;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .form-group button:hover {
      background-color: #218838;
    }
  </style>
  <!-- Load Google Apps Script Client API -->
  <script src="https://apis.google.com/js/platform.js"></script>
</head>
<body>
  <div class="container">
    <h1>Customer Dues Management</h1>
    <div class="tab">
      <button class="tablinks" onclick="window.openTab(event, 'EntryDetails')">Entry Details</button>
      <button class="tablinks" onclick="window.openTab(event, 'SendWhatsApp')">Send WhatsApp Message</button>
      <button class="tablinks" onclick="window.openTab(event, 'ClearDue')">Clear Due</button>
    </div>

    <div id="EntryDetails" class="tabcontent">
      <h2>Entry Details</h2>
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" required>
      </div>
      <div class="form-group">
        <label for="item">Item:</label>
        <input type="text" id="item" required>
      </div>
      <div class="form-group">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" required>
      </div>
      <div class="form-group">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" required>
      </div>
      <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <button onclick="addEntry()" id ="addEntry">Add Entry</button>
      </div>
    </div>

    <div id="SendWhatsApp" class="tabcontent">
      <h2>Send WhatsApp Message</h2>
      <div class="form-group">
        <button onclick="sendWhatsApp()">Send WhatsApp Notification</button>
      </div>
    </div>

    <div id="ClearDue" class="tabcontent">
      <h2>Clear Due</h2>
      <div class="form-group">
        <label for="clearName">Name:</label>
        <input type="text" id="clearName" required>
      </div>
      <div class="form-group">
        <label for="clearAmount">Amount:</label>
        <input type="number" id="clearAmount" required>
      </div>
      <div class="form-group">
        <button onclick="clearDue()">Clear Due</button>
      </div>
    </div>
  </div>

  <script>
    // Define openTab function in global scope
    window.openTab = function(evt, tabName) {
      const tabcontent = document.getElementsByClassName("tabcontent");
      for (let i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
      }
      const tablinks = document.getElementsByClassName("tablinks");
      for (let i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
      }
      document.getElementById(tabName).style.display = "block";
      evt.currentTarget.className += " active";
    };
  
    function onSuccess(response) {
      console.log("Success response:", response);
      alert("Operation successful!");
    }
  
    function addEntry() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const item = document.getElementById("item").value;
      const quantity = document.getElementById("quantity").value;
      const amount = document.getElementById("amount").value;
      const date = document.getElementById("date").value;
  
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run.withSuccessHandler(onSuccess).addEntry(name, phone, item, quantity, amount, date);
      } else {
        console.warn("Google Apps Script environment not detected. Running in standalone mode.");
        alert(`Entry would be added: Name=${name}, Phone=${phone}, Item=${item}, Quantity=${quantity}, Amount=${amount}, Date=${date}`);
      }
    }
  
    function sendWhatsApp() {
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run.getCustomersWithDueAmount((customers) => {
          customers.forEach(customer => {
            const message = `Hi ${customer.name}, your due amount is ${customer.dueAmount}. Please clear it at the earliest.`;
            google.script.run.sendWhatsAppMessage(customer.phone, message);
          });
          alert("WhatsApp notifications sent!");
        });
      } else {
        console.warn("Google Apps Script environment not detected.");
        alert("Simulating WhatsApp message sending.");
      }
    }
  
    function clearDue() {
      const name = document.getElementById("clearName").value;
      const amount = document.getElementById("clearAmount").value;
  
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run.clearDueAmount(name, amount);
      } else {
        console.warn("Google Apps Script environment not detected.");
        alert(`Simulating clearing due for: Name=${name}, Amount=${amount}`);
      }
    }
  
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelector('.tablinks').click();
    });
  </script>
  
</body>
</html>
