<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Oil Sales & Due Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            background: linear-gradient(90deg, #ff6600, #0033a0);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 10px;
            position: relative;
        }

        label {
            font-weight: bold;
            color: #0033a0;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: 2px solid #ff6600;
        }

        button {
            width: 100%;
            background-color: #ff6600;
            color: white;
            padding: 10px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #cc5500;
        }

        .error {
            color: red;
            font-size: 14px;
            display: none;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background-color: #f0f0f0;
        }

        @media (max-width: 500px) {
            .container {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Indian Oil Sales Entry</h2>
        <form id="salesForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Phone Number:</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" required placeholder="Enter 10-digit mobile number">
            </div>

            <div class="form-group">
                <label>Item:</label>
                <input type="text" id="item" required>
            </div>

            <div class="form-group">
                <label>Quantity:</label>
                <input type="number" id="quantity" min="1" required>
            </div>

            <div class="form-group">
                <label>Amount:</label>
                <input type="number" id="amount" min="1" required>
            </div>

            <div class="form-group">
                <label>Date:</label>
                <input type="date" id="date" required>
            </div>

            <button type="button" onclick="submitForm()">Submit</button>
        </form>
    </div>

    <div class="container">
        <h2>Check Due Amount</h2>
        <div class="form-group">
            <label>Search Name:</label>
            <input type="text" id="customerSearch" placeholder="Type to search customer" oninput="searchCustomers(this.value)">
            <div id="searchSuggestions" class="suggestions"></div>
        </div>

        <div class="form-group">
            <label>Due Amount:</label>
            <input type="text" id="dueAmount" readonly>
        </div>

        <button type="button" onclick="sendWhatsApp()">Send WhatsApp Reminder</button>
    </div>

    <script>
        document.getElementById("date").valueAsDate = new Date();
        let customersData = [];

        function submitForm() {
            let data = {
                name: document.getElementById("name").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                item: document.getElementById("item").value.trim(),
                quantity: document.getElementById("quantity").value.trim(),
                amount: document.getElementById("amount").value.trim(),
                date: document.getElementById("date").value
            };

            fetch("https://script.google.com/macros/s/AKfycbxgjyl_S8QCBKpft7chRsnOoaiSznt0I301yNhpBeaS3CYcrsEGlexn_H3UcaWxmZHe/exec", {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            })
            .then(() => {
                alert("Data submitted successfully!");
                fetchCustomersData(); // Refresh the customers data after submission
                // Clear form after successful submission
                document.getElementById("salesForm").reset();
                document.getElementById("date").valueAsDate = new Date();
            })
            .catch(error => alert("Error: " + error));
        }

        async function fetchCustomersData() {
            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbxgjyl_S8QCBKpft7chRsnOoaiSznt0I301yNhpBeaS3CYcrsEGlexn_H3UcaWxmZHe/exec");
                const data = await response.json();
                customersData = data.names || [];
                console.log("Fetched customers data:", customersData); // Debug log
            } catch (error) {
                console.error("Error fetching names:", error);
                customersData = [];
            }
        }

        function searchCustomers(query) {
            console.log("Searching for:", query); // Debug log
            console.log("Available customers:", customersData); // Debug log
            
            const suggestionsDiv = document.getElementById("searchSuggestions");
            suggestionsDiv.innerHTML = '';
            
            if (!query) {
                suggestionsDiv.style.display = 'none';
                return;
            }

            if (!Array.isArray(customersData)) {
                console.error("customersData is not an array:", customersData);
                return;
            }

            const matches = customersData.filter(customer => 
                customer && customer.name && 
                customer.name.toLowerCase().includes(query.toLowerCase())
            );

            console.log("Matches found:", matches); // Debug log

            if (matches.length > 0) {
                suggestionsDiv.style.display = 'block';
                matches.forEach(customer => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = `${customer.name}${customer.dueAmount > 0 ? ` (Due: ₹${customer.dueAmount})` : ''}`;
                    div.onclick = () => selectCustomer(customer);
                    suggestionsDiv.appendChild(div);
                });
            } else {
                suggestionsDiv.style.display = 'none';
            }
        }

        function selectCustomer(customer) {
            document.getElementById("customerSearch").value = customer.name;
            document.getElementById("dueAmount").value = customer.dueAmount || "0";
            document.getElementById("searchSuggestions").style.display = 'none';
        }

        function sendWhatsApp() {
            let name = document.getElementById("customerSearch").value;
            let dueAmount = document.getElementById("dueAmount").value;

            if (!name || !dueAmount) {
                alert("Select a name to send a WhatsApp message.");
                return;
            }

            // Find the customer's phone number from customersData
            const customer = customersData.find(c => c.name === name);
            if (!customer || !customer.phone) {
                alert("Phone number not found for this customer.");
                return;
            }

            let message = `Dear ${name}, your due amount is Rs. ${dueAmount}. Please make the payment soon.`;
            let whatsappURL = `https://wa.me/${customer.phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, "_blank");
        }

        // Load customers data when the page loads
        window.onload = fetchCustomersData;

        // Close suggestions when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#customerSearch') && !e.target.closest('#searchSuggestions')) {
                document.getElementById('searchSuggestions').style.display = 'none';
            }
        });

    </script>

</body>
</html>
